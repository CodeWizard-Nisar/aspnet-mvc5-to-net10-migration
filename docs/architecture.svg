<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 660" width="920" height="660" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="920" height="660" fill="#ffffff"/>

  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8c959f"/>
    </marker>
    <marker id="arwS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8c959f"/>
    </marker>
  </defs>

  <text x="40" y="40" font-size="19" font-weight="600" fill="#1f2328">Incremental migration: both runtimes serve traffic at once</text>
  <text x="40" y="62" font-size="13" fill="#656d76">Pages move from .NET Framework 4.8 to .NET 10 one at a time, behind a single proxy</text>

  <!-- connectors drawn first so boxes sit on top -->
  <g fill="none" stroke="#8c959f" stroke-width="1.25">
    <path d="M460 128V158" marker-end="url(#arw)"/>
    <path d="M400 202H250V238" marker-end="url(#arw)"/>
    <path d="M520 202H670V238" marker-end="url(#arw)"/>
    <path d="M250 348V392" marker-end="url(#arw)" stroke-dasharray="5 4"/>
    <path d="M670 348V392" marker-end="url(#arw)" stroke-dasharray="5 4"/>
    <path d="M250 348V470" marker-end="url(#arw)"/>
    <path d="M670 348V470" marker-end="url(#arw)"/>
    <path d="M790 470V506H600" marker-end="url(#arw)"/>
    <path d="M460 546V592" marker-end="url(#arw)"/>
  </g>

  <!-- browser -->
  <g>
    <rect x="380" y="84" width="160" height="44" rx="22" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/>
    <text x="460" y="112" text-anchor="middle" font-size="14" fill="#1f2328">Browser</text>
  </g>

  <!-- yarp -->
  <g>
    <rect x="340" y="158" width="240" height="44" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
    <text x="460" y="186" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">YARP reverse proxy</text>
  </g>

  <text x="300" y="222" text-anchor="middle" font-size="12" fill="#656d76">registration</text>
  <text x="624" y="222" text-anchor="middle" font-size="12" fill="#656d76">admin</text>

  <!-- legacy -->
  <g>
    <rect x="80" y="238" width="340" height="110" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/>
    <text x="250" y="268" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Legacy.Web</text>
    <text x="250" y="292" text-anchor="middle" font-size="13" fill="#656d76">.NET Framework 4.8</text>
    <text x="250" y="314" text-anchor="middle" font-size="13" fill="#1f2328">ASP.NET MVC 5</text>
    <text x="250" y="334" text-anchor="middle" font-size="13" fill="#1f2328">Registration wizard</text>
  </g>

  <!-- modern -->
  <g>
    <rect x="500" y="238" width="340" height="110" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/>
    <text x="670" y="268" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Modern.Web</text>
    <text x="670" y="292" text-anchor="middle" font-size="13" fill="#656d76">.NET 10 (LTS)</text>
    <text x="670" y="314" text-anchor="middle" font-size="13" fill="#1f2328">ASP.NET Core MVC</text>
    <text x="670" y="334" text-anchor="middle" font-size="13" fill="#1f2328">Admin portal</text>
  </g>

  <!-- shared session -->
  <g>
    <rect x="300" y="392" width="320" height="56" rx="8" fill="#fff8c5" stroke="#9a6700" stroke-width="1.25"/>
    <text x="460" y="416" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Shared session state</text>
    <text x="460" y="436" text-anchor="middle" font-size="12" fill="#656d76">Microsoft.AspNetCore.SystemWebAdapters</text>
  </g>

  <!-- shared libraries -->
  <g>
    <rect x="80" y="470" width="520" height="76" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/>
    <text x="340" y="498" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Shared.Domain + Shared.Data</text>
    <text x="340" y="520" text-anchor="middle" font-size="12" fill="#656d76">multi-targeted: net48 and net10.0</text>
    <text x="340" y="538" text-anchor="middle" font-size="12" fill="#656d76">Entity Framework 6.5, no System.Web dependency</text>
  </g>

  <!-- worker -->
  <g>
    <rect x="660" y="470" width="180" height="76" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/>
    <text x="750" y="500" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Jobs.Worker</text>
    <text x="750" y="521" text-anchor="middle" font-size="12" fill="#656d76">.NET 10</text>
    <text x="750" y="538" text-anchor="middle" font-size="12" fill="#656d76">Quartz.NET</text>
  </g>

  <!-- database -->
  <g>
    <rect x="360" y="592" width="200" height="48" rx="24" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/>
    <text x="460" y="622" text-anchor="middle" font-size="14" fill="#1f2328">SQL Server</text>
  </g>

  <!-- key -->
  <g>
    <rect x="700" y="84" width="16" height="16" rx="3" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/>
    <text x="724" y="97" font-size="12" fill="#656d76">migrated to .NET 10</text>
    <rect x="700" y="110" width="16" height="16" rx="3" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/>
    <text x="724" y="123" font-size="12" fill="#656d76">still on .NET Framework</text>
  </g>
</svg>
